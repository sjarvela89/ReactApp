name: Run Unit Tests

on:
  push:
    branches:
      - UnitTests
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0'

      - name: Install dependencies
        run: dotnet restore ReactApp1/ReactApp1.Tests

      - name: Run backend unit tests
        run: dotnet test ReactApp1/ReactApp1.Tests --logger trx

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
        cd ReactApp1/reactapp1.client
        npm install

      - name: Run frontend unit tests
        run: |
        cd ReactApp1/reactapp1.client
        npm test
